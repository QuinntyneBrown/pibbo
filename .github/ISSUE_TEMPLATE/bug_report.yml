name: Bug report
description: Something in Pibbo does not work as the requirements say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Do not report a security vulnerability here; follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Sound Out and touch the first letter
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Name the requirement in docs/specs/L2.md if you know it.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Home
        - Count
        - Sound Out
        - Sound or recordings
        - Pictures, words or numbers
        - End-to-end tests
        - Documentation, mocks or design system
        - Build or CI
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Device, operating system, browser and version, whether the sound was on, and the commit you ran.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Console output or a screenshot. Do not include a photo, a recording or the name of a child.
      render: text
