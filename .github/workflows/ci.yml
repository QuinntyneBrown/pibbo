name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # One critical acceptance path per feature (ADR 0016); verify.mjs runs every spec locally.
      - run: npx playwright test --grep @critical

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # NuGet audit (Directory.Build.props) fails restore on a high or critical vulnerability.
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore -c Release
      - run: tools/audit-packages.sh
      # One critical acceptance path per feature (ADR 0016); verify.mjs runs every test locally.
      - run: dotnet test --no-build -c Release --filter Category=Critical

  backend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pibbo-api:ci backend
      - name: The image runs as a non-root user, read-only, and becomes ready
        run: |
          user="$(docker inspect --format '{{.Config.User}}' pibbo-api:ci)"
          test -n "$user" && test "$user" != "root" && test "$user" != "0"
          content="$RUNNER_TEMP/content"
          mkdir -p "$content"
          cp backend/content/content.json "$content/"
          cp -r frontend/projects/pibbo/public "$content/assets"
          docker run -d --name api --read-only -v "$content:/app/content:ro" -v pibbo-data:/data pibbo-api:ci
          for attempt in $(seq 1 30); do
            if docker exec api dotnet Pibbo.Api.dll probe; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
