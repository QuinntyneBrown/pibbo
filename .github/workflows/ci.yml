name: CI

# Every push and pull request runs the checks. A push to main that passes them is published to
# Azure Static Web Apps (ADR 0032, docs/deploy.md): the build the checks ran against is the one
# deployed, unchanged.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A newer pull-request push replaces the older run; on main every commit runs to the end, in
  # order, so each one is published and a deployment is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run build
      # The host's settings, generated from deploy/security-headers.json into the build.
      - run: node ../tools/deploy/static-web-app-config.mjs
      - run: npx playwright install --with-deps chromium
      # One critical acceptance path per feature (ADR 0016); verify.mjs runs every spec locally.
      - run: npx playwright test --grep @critical
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pibbo-browser
          path: frontend/dist/pibbo/browser/
          retention-days: 7

  deploy:
    needs: frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://blue-ocean-09e66a70f.8.azurestaticapps.net
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pibbo-browser
          path: browser
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: browser
          skip_app_build: true
          skip_api_build: true

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # NuGet audit (Directory.Build.props) fails restore on a high or critical vulnerability.
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore -c Release
      - run: tools/audit-packages.sh
      # One critical acceptance path per feature (ADR 0016); verify.mjs runs every test locally.
      - run: dotnet test --no-build -c Release --filter Category=Critical

  backend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pibbo-api:ci backend
      - name: The image runs as a non-root user, read-only, and becomes ready
        run: |
          user="$(docker inspect --format '{{.Config.User}}' pibbo-api:ci)"
          test -n "$user" && test "$user" != "root" && test "$user" != "0"
          content="$RUNNER_TEMP/content"
          mkdir -p "$content"
          cp backend/content/content.json "$content/"
          cp -r frontend/projects/pibbo/public "$content/assets"
          docker run -d --name api --read-only -v "$content:/app/content:ro" -v pibbo-data:/data pibbo-api:ci
          for attempt in $(seq 1 30); do
            if docker exec api dotnet Pibbo.Api.dll probe; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
