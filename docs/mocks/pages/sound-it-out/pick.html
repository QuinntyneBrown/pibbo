  <div class="shell__ask">
    <svg class="pibbo pibbo--md " viewBox="0 0 120 120" role="img" aria-label="Pibbo"><path class="pibbo__stem" d="M60 30 C60 22 60 18 61 13"/><path class="pibbo__leaf" d="M60 18 C52 18 44 13 43 5 C51 4 59 9 60 18 Z"/><path class="pibbo__leaf" d="M61 15 C66 8 75 5 82 8 C79 16 70 19 61 15 Z"/><ellipse class="pibbo__wing" cx="19" cy="74" rx="9" ry="15" transform="rotate(18 19 74)"/><ellipse class="pibbo__wing" cx="101" cy="74" rx="9" ry="15" transform="rotate(-18 101 74)"/><ellipse class="pibbo__foot" cx="49" cy="108" rx="8" ry="5"/><ellipse class="pibbo__foot" cx="71" cy="108" rx="8" ry="5"/><ellipse class="pibbo__body" cx="60" cy="67" rx="43" ry="41"/><ellipse class="pibbo__belly" cx="60" cy="84" rx="25" ry="18"/><ellipse class="pibbo__white" cx="45" cy="57" rx="11" ry="12.5"/><ellipse class="pibbo__white" cx="75" cy="57" rx="11" ry="12.5"/><circle class="pibbo__ink" cx="46" cy="58.5" r="6.5"/><circle class="pibbo__ink" cx="76" cy="58.5" r="6.5"/><circle class="pibbo__white" cx="48" cy="56.0" r="2.2"/><circle class="pibbo__white" cx="78" cy="56.0" r="2.2"/><circle class="pibbo__cheek" cx="30" cy="73" r="6"/><circle class="pibbo__cheek" cx="90" cy="73" r="6"/><path class="pibbo__beak" d="M53 69 Q60 65.5 67 69 Q60 79 53 69 Z"/></svg>
    <div class="bubble">
      <svg class="bubble__picture" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg>

      <button class="hear hear--read" type="button" aria-label="Hear it again"><svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z"/><path d="M16 9a5 5 0 0 1 0 6M19.4 18.4a9 9 0 0 0 0-12.8"/></svg></button>
    </div>
  </div>
  <main class="shell__game" id="main" aria-labelledby="prompt">
    <h1 class="visually-hidden">Sound it out</h1>
    <div class="stage stage--activity"><div class="tiles" role="group" aria-label="The sounds in the word"><div class="tiles__unit"><button class="tile tile--heard press" type="button" disabled aria-label="m, says /m/">m</button><span class="tiles__say" aria-hidden="true">/m/</span></div><div class="tiles__unit"><button class="tile tile--heard press" type="button" disabled aria-label="a, says /a/">a</button><span class="tiles__say" aria-hidden="true">/a/</span></div><div class="tiles__unit"><button class="tile tile--heard press" type="button" disabled aria-label="p, says /p/">p</button><span class="tiles__say" aria-hidden="true">/p/</span></div></div><div class="pick" role="group" aria-label="Pictures"><button class="pick__option press" type="button" aria-pressed="false" aria-label="sun" data-check-href="retry.html?choice=0"><img class="picture " src="../../assets/pictures/sun.jpg" alt="" draggable="false"></button><button class="pick__option press" type="button" aria-pressed="true" aria-label="map" data-check-href="correct.html"><img class="picture " src="../../assets/pictures/map.jpg" alt="" draggable="false"></button><button class="pick__option press" type="button" aria-pressed="false" aria-label="cat" data-check-href="retry.html?choice=2"><img class="picture " src="../../assets/pictures/cat.jpg" alt="" draggable="false"></button></div></div>
  </main>
