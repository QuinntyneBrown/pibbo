<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skip-count · start — Pibbo mocks</title>
<meta name="mock:kind" content="page">
<meta name="mock:screen" content="skip-count">
<meta name="mock:state" content="start">
<meta name="description" content="By 5s from 0; the first hop is next.">
<link rel="stylesheet" href="../../assets/tokens.css">
<link rel="stylesheet" href="../../assets/ui.css">

</head>
<body>
<a class="skip-link" href="#main">Skip to the game</a>
<div class="shell shell--count">
  <header class="shell__top">
    <a class="chunky chunky--white chunky--icon press" href="../home/default.html" aria-label="Leave game"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
    <div class="progress" role="progressbar" aria-label="Game progress" aria-valuemin="0" aria-valuemax="5" aria-valuenow="4"><div class="progress__fill progress__fill--4"></div></div>
  </header>
  <div class="shell__ask">
    <svg class="pibbo pibbo--md " viewBox="0 0 120 120" role="img" aria-label="Pibbo"><path class="pibbo__stem" d="M60 30 C60 22 60 18 61 13"/><path class="pibbo__leaf" d="M60 18 C52 18 44 13 43 5 C51 4 59 9 60 18 Z"/><path class="pibbo__leaf" d="M61 15 C66 8 75 5 82 8 C79 16 70 19 61 15 Z"/><ellipse class="pibbo__wing" cx="19" cy="74" rx="9" ry="15" transform="rotate(18 19 74)"/><ellipse class="pibbo__wing" cx="101" cy="74" rx="9" ry="15" transform="rotate(-18 101 74)"/><ellipse class="pibbo__foot" cx="49" cy="108" rx="8" ry="5"/><ellipse class="pibbo__foot" cx="71" cy="108" rx="8" ry="5"/><ellipse class="pibbo__body" cx="60" cy="67" rx="43" ry="41"/><ellipse class="pibbo__belly" cx="60" cy="84" rx="25" ry="18"/><ellipse class="pibbo__white" cx="45" cy="57" rx="11" ry="12.5"/><ellipse class="pibbo__white" cx="75" cy="57" rx="11" ry="12.5"/><circle class="pibbo__ink" cx="46" cy="58.5" r="6.5"/><circle class="pibbo__ink" cx="76" cy="58.5" r="6.5"/><circle class="pibbo__white" cx="48" cy="56.0" r="2.2"/><circle class="pibbo__white" cx="78" cy="56.0" r="2.2"/><circle class="pibbo__cheek" cx="30" cy="73" r="6"/><circle class="pibbo__cheek" cx="90" cy="73" r="6"/><path class="pibbo__beak" d="M53 69 Q60 65.5 67 69 Q60 79 53 69 Z"/></svg>
    <div class="bubble">
      <p class="bubble__text" id="prompt">Hop by 5s. Where do we land next?</p>
      <button class="hear" type="button" aria-label="Hear it again"><svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z"/><path d="M16 9a5 5 0 0 1 0 6M19.4 18.4a9 9 0 0 0 0-12.8"/></svg></button>
    </div>
  </div>
  <main class="shell__game" id="main" aria-labelledby="prompt">
    <h1 class="visually-hidden">Skip-count</h1>
    <div class="stage">
      <div class="switch" role="radiogroup" aria-label="Count by"><button class="switch__option switch__option--sm" type="button" role="radio" aria-checked="false">By 2s</button><button class="switch__option switch__option--sm" type="button" role="radio" aria-checked="true">By 5s</button><button class="switch__option switch__option--sm" type="button" role="radio" aria-checked="false">By 10s</button></div>
      <svg class="number-line" viewBox="0 0 1040 170" role="img" aria-label="Number line counting by 5: 0"><line class="number-line__axis" x1="20" y1="110" x2="1020" y2="110"/><circle class="number-line__dot number-line__dot--said" cx="20" cy="110" r="13"/><text class="number-line__label" x="20" y="160">0</text><circle class="number-line__dot number-line__dot--next" cx="120" cy="110" r="9"/><text class="number-line__label number-line__label--next" x="120" y="160">?</text><circle class="number-line__dot " cx="220" cy="110" r="9"/><circle class="number-line__dot " cx="320" cy="110" r="9"/><circle class="number-line__dot " cx="420" cy="110" r="9"/><circle class="number-line__dot " cx="520" cy="110" r="9"/><circle class="number-line__dot " cx="620" cy="110" r="9"/><circle class="number-line__dot " cx="720" cy="110" r="9"/><circle class="number-line__dot " cx="820" cy="110" r="9"/><circle class="number-line__dot " cx="920" cy="110" r="9"/><circle class="number-line__dot " cx="1020" cy="110" r="9"/></svg>
      <div class="choices" role="group" aria-label="Where do we land next?"><button class="numeral numeral--wide press" type="button">5</button><button class="numeral numeral--wide press" type="button">4</button><button class="numeral numeral--wide press" type="button">10</button></div>
    </div>
  </main>
  <footer class="answer-bar answer-bar--check"><span class="answer-bar__spacer" aria-hidden="true"></span></footer>
</div>
<p class="mock-note" style="top: 6rem; right: 1rem;">Changing By 2s / 5s / 10s starts the line again from 0.</p>

</nav>

</body>
</html>
