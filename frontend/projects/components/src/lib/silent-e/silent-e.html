<p class="rule">
  <span class="rule__glyph">{{ vowel() }}_e</span> {{ ruleBefore() }} {{ vowel() }}
  {{ ruleAfter() }}
</p>
<div class="before">
  <img class="picture" [src]="picture()" [alt]="word()" draggable="false" />
  <span class="before__word">{{ word() }}</span>
  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7" /></svg>
  <span class="before__note">{{ note() }}</span>
</div>
