<div class="switch switch--subjects">
  @for (group of groups(); track group.id) {
    <button
      type="button"
      class="switch__option"
      [class.switch__option--read]="group.id === 'read'"
      [attr.aria-pressed]="group.id === chosen()"
      (pbTap)="touched.emit(group)"
    >
      {{ group.name }}
    </button>
  }
</div>
