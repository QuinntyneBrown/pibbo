<div
  class="tiles"
  [class.tiles--beats]="beats()"
  [class.tiles--long]="sounds().length + (quietE() === null ? 0 : 1) > 3"
  role="group"
  aria-label="The sounds in the word"
>
  @for (sound of sounds(); track $index; let i = $index) {
    @let heardIt = heard()[i] ?? false;
    <div class="tiles__unit">
      <button
        type="button"
        class="tile"
        [class.tile--wide]="sound.letters.length > 1"
        [class.tile--heard]="heardIt"
        [class.tile--next]="next() === i"
        [class.tile--sounding]="sounding() === i"
        [class.tile--changed]="quietE() === true && changed() === i"
        [disabled]="next() !== i"
        [attr.aria-label]="
          heardIt
            ? sound.letters + ', says ' + sound.shown
            : next() === i
              ? sound.letters + ', tap to hear it'
              : quietE() === true && changed() === i
                ? sound.letters + ', changed by the quiet e'
                : sound.letters
        "
        (pbTap)="touched.emit(i)"
      >
        {{ sound.letters }}
        @if (quietE() === true && changed() === i) {
          <span class="tile__mark" aria-hidden="true"></span>
        }
      </button>
      <span class="tiles__say" [class.tiles__say--hidden]="!heardIt" aria-hidden="true">{{
        sound.shown
      }}</span>
    </div>
  }
  @if (quietE() !== null) {
    <div class="tiles__unit">
      <button
        type="button"
        class="tile tile--silent"
        [class.tile--added]="quietE()"
        [class.tile--next]="quietE() === false && canToggleE()"
        [disabled]="!canToggleE()"
        [attr.aria-pressed]="quietE()"
        [attr.aria-label]="
          !quietE()
            ? 'e, tap to add a quiet e'
            : canToggleE()
              ? 'e, quiet, tap to take it away'
              : 'e, quiet'
        "
        (pbTap)="toggledE.emit()"
      >
        e
      </button>
      <span class="tiles__say" [class.tiles__say--hidden]="!quietE()" aria-hidden="true"
        >quiet</span
      >
    </div>
  }
</div>
@if (choices(); as offered) {
  <div class="choose" role="group" aria-label="The first two sounds">
    @for (choice of offered; track choice) {
      <button
        type="button"
        class="tile choose__option"
        [class.tile--wide]="choice.length > 1"
        [attr.aria-pressed]="chosen() === choice"
        [attr.aria-label]="choice.split('').join(' and ')"
        (pbTap)="chose.emit(choice)"
      >
        {{ choice }}
      </button>
    }
  </div>
}
@if (showBlend()) {
  <div class="blend">
    <div class="blend__bar" aria-hidden="true">
      <div [class]="'blend__fill blend__fill--' + fill()"></div>
    </div>
    <button type="button" class="chunky" [disabled]="!canBlend()" (pbTap)="blend.emit()">
      Read it fast
    </button>
  </div>
}
