<div class="dialog gate" role="dialog" aria-modal="true" aria-labelledby="gate-title" aria-describedby="gate-task">
  <button type="button" class="dialog__close" aria-label="Close" (pbTap)="closed.emit()">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
  </button>
  <h2 class="dialog__title" id="gate-title">For grown-ups</h2>
  <p class="gate__task" id="gate-task">{{ task() }}</p>
  <div class="gate__dots" role="status" [attr.aria-label]="touched() + ' of ' + length() + ' touched'">
    @for (i of dots(); track i) {
      <span class="gate__dot" [class.gate__dot--done]="i < touched()" aria-hidden="true"></span>
    }
  </div>
  <div class="gate__keys" role="group" aria-label="Numbers">
    @for (n of keys; track n) {
      <button type="button" class="gate__key" (pbTap)="key.emit(n)">{{ n }}</button>
    }
  </div>
  <p class="dialog__note">A wrong number closes this and goes back to Pibbo.</p>
</div>
