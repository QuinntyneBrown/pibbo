<button
  type="button"
  class="game-card press"
  [class.game-card--count]="activity().group === 'count'"
  [class.game-card--read]="activity().group === 'read'"
  (pbTap)="touched.emit(activity())"
>
  <span class="game-card__glyph" aria-hidden="true">{{ activity().glyph }}</span>
  <span class="game-card__body">
    <span class="game-card__title">{{ activity().name }}</span>
  </span>
</button>
