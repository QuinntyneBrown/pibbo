<div class="stage stage--row-md">
  <div class="frame-picture">
    <img class="picture" [src]="picture()" [alt]="word()" draggable="false" />
  </div>
  <div class="spell">
    <div class="boxes" role="group" aria-label="One box for each sound">
      @for (letter of boxes(); track $index; let i = $index) {
        <div class="boxes__unit">
          <button
            type="button"
            class="box"
            [class.box--filled]="letter !== null && !right()"
            [class.box--right]="right()"
            [class.box--next]="next() === i"
            [disabled]="letter === null ? !canPlace() : !canRemove()"
            [attr.aria-label]="
              letter ? 'Remove ' + letter.letters : 'Empty box for sound ' + (i + 1)
            "
            (pbTap)="box.emit(i)"
          >
            {{ letter?.letters ?? '' }}
          </button>
          <button
            type="button"
            class="speaker"
            [attr.aria-label]="'Hear sound ' + (i + 1)"
            (pbTap)="speaker.emit(i)"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z"
              />
              <path d="M16 9a5 5 0 0 1 0 6M19.4 18.4a9 9 0 0 0 0-12.8" />
            </svg>
          </button>
        </div>
      }
    </div>
    <div class="bank" role="group" aria-label="Letters">
      @for (sound of bank(); track sound.letters; let i = $index) {
        <button
          type="button"
          class="bank__letter"
          [disabled]="!canPlace()"
          (pbTap)="letter.emit(i)"
        >
          {{ sound.letters }}
        </button>
      }
    </div>
  </div>
</div>
