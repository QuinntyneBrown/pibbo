<svg
  class="pibbo"
  [class.pibbo--cheer]="mood() === 'cheer'"
  [class.pibbo--xs]="size() === 'xs'"
  [class.pibbo--sm]="size() === 'sm'"
  [class.pibbo--lg]="size() === 'lg'"
  [class.pibbo--xl]="size() === 'xl'"
  viewBox="0 0 120 120"
  role="img"
  [attr.aria-label]="label()"
>
  <path class="pibbo__stem" d="M60 30 C60 22 60 18 61 13" />
  <path class="pibbo__leaf" d="M60 18 C52 18 44 13 43 5 C51 4 59 9 60 18 Z" />
  <path class="pibbo__leaf" d="M61 15 C66 8 75 5 82 8 C79 16 70 19 61 15 Z" />
  @if (mood() === 'cheer') {
    <ellipse class="pibbo__wing" cx="19" cy="52" rx="9" ry="15" transform="rotate(35 19 52)" />
    <ellipse class="pibbo__wing" cx="101" cy="52" rx="9" ry="15" transform="rotate(-35 101 52)" />
  } @else {
    <ellipse class="pibbo__wing" cx="19" cy="74" rx="9" ry="15" transform="rotate(18 19 74)" />
    <ellipse class="pibbo__wing" cx="101" cy="74" rx="9" ry="15" transform="rotate(-18 101 74)" />
  }
  <ellipse class="pibbo__foot" cx="49" cy="108" rx="8" ry="5" />
  <ellipse class="pibbo__foot" cx="71" cy="108" rx="8" ry="5" />
  <ellipse class="pibbo__body" cx="60" cy="67" rx="43" ry="41" />
  <ellipse class="pibbo__belly" cx="60" cy="84" rx="25" ry="18" />
  @if (mood() === 'cheer') {
    <path class="pibbo__line" d="M36 60 Q45 49 54 60" />
    <path class="pibbo__line" d="M66 60 Q75 49 84 60" />
  } @else {
    <ellipse class="pibbo__white" cx="45" cy="57" rx="11" ry="12.5" />
    <ellipse class="pibbo__white" cx="75" cy="57" rx="11" ry="12.5" />
    <circle class="pibbo__ink" cx="46" cy="58.5" r="6.5" />
    <circle class="pibbo__ink" cx="76" cy="58.5" r="6.5" />
    <circle class="pibbo__white" cx="48" cy="56" r="2.2" />
    <circle class="pibbo__white" cx="78" cy="56" r="2.2" />
  }
  <circle class="pibbo__cheek" cx="30" cy="73" r="6" />
  <circle class="pibbo__cheek" cx="90" cy="73" r="6" />
  @switch (mood()) {
    @case ('cheer') {
      <path class="pibbo__beak-deep" d="M51 69 Q60 66 69 69 Q66 81 60 81 Q54 81 51 69 Z" />
    }
    @case ('oh') {
      <ellipse class="pibbo__beak-deep" cx="60" cy="74" rx="5" ry="6" />
    }
    @default {
      <path class="pibbo__beak" d="M53 69 Q60 65.5 67 69 Q60 79 53 69 Z" />
    }
  }
</svg>
