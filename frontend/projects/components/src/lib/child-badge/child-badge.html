<span class="pill pill--stars" role="img" [attr.aria-label]="stars() + ' stars'">
  <svg class="pill__star" viewBox="0 0 24 24" aria-hidden="true">
    <path d="m12 2 3 7 7 .6-5.3 4.7 1.6 7.2L12 17.8 5.7 21.5l1.6-7.2L2 9.6 9 9z" />
  </svg>
  <span aria-hidden="true">{{ stars() }}</span>
</span>
<span class="pill pill--child">
  <span class="pill__initial" aria-hidden="true">{{ initial() }}</span>
  <span class="pill__name">{{ name() }}</span>
</span>
