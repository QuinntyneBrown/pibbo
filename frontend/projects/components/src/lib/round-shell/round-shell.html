<div
  [class]="'shell shell--' + group() + ' shell--' + layout()"
  [class.shell--fit]="fit()"
>
  <header class="shell__top">
    <button
      type="button"
      class="chunky chunky--white chunky--icon"
      aria-label="Leave game"
      (pbTap)="leave.emit()"
    >
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
    <div
      class="progress"
      role="progressbar"
      aria-label="Game progress"
      aria-valuemin="0"
      [attr.aria-valuemax]="rounds()"
      [attr.aria-valuenow]="done()"
    >
      <div class="progress__fill" [class]="'progress__fill progress__fill--' + done()"></div>
    </div>
  </header>
  <div class="shell__ask">
    <pb-pibbo [mood]="mood()" />
    <div class="bubble">
      @if (instruction().picture === 'tap') {
        <svg class="bubble__picture" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 11V5a2 2 0 0 1 4 0v6" />
          <path d="M13 10a2 2 0 0 1 4 0v2" />
          <path
            d="M17 11a2 2 0 0 1 4 0v3a7 7 0 0 1-7 7h-1a7 7 0 0 1-5-2l-3-3a2 2 0 0 1 3-3l1 1V11"
          />
        </svg>
      } @else {
        <svg class="bubble__picture" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="4" />
          <path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01" />
        </svg>
      }
      <p class="bubble__text" id="prompt">{{ instruction().text }}</p>
      <button type="button" class="hear" aria-label="Hear it again" (pbTap)="replay.emit()">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z"
          />
          <path d="M16 9a5 5 0 0 1 0 6M19.4 18.4a9 9 0 0 0 0-12.8" />
        </svg>
      </button>
    </div>
  </div>
  <main class="shell__game" id="main" aria-labelledby="prompt">
    <h1 class="visually-hidden">{{ title() }}</h1>
    <ng-content />
  </main>
  <div class="shell__answer">
    <ng-content select="[answer]" />
  </div>
</div>
