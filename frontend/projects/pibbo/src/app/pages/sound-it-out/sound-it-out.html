<pb-round-shell
  title="Sound it out"
  group="read"
  [instruction]="instruction()"
  [mood]="mood()"
  [done]="done()"
  [rounds]="content.roundsPerPlay"
  (replay)="replay()"
  (leave)="leave()"
>
  <div class="stage">
    @if (silentE(); as e) {
      <pb-silent-e
        [vowel]="e.vowel"
        [ruleBefore]="content.silentE.rule.before"
        [ruleAfter]="content.silentE.rule.after"
        [word]="e.word"
        [picture]="e.picture"
        [note]="e.note"
      />
    }
    @if (syllableRule(); as glyph) {
      <pb-rule [glyph]="glyph" [text]="content.syllables.rule" />
    }
    <pb-word-tiles
      [sounds]="sounds()"
      [heard]="round().heard"
      [next]="nextToTouch()"
      [sounding]="sounding()"
      [showBlend]="!picking() && !choices()"
      [canBlend]="round().phase === 'ready'"
      [choices]="choices()"
      [quietE]="round().eAdded"
      [canToggleE]="
        round().phase === 'magic-e' || round().phase === 'sounding' || round().phase === 'ready'
      "
      [changed]="silentE()?.changed ?? null"
      (touched)="touchLetter($event)"
      (blend)="blend()"
      (chose)="chooseFirstTwo($event)"
      (toggledE)="toggleE()"
    />
    @if (picking()) {
      <pb-picture-pick
        [pictures]="round().pictures"
        [chosen]="round().chosen"
        [right]="right()"
        [locked]="round().phase !== 'picking'"
        (chose)="choosePicture($event)"
      />
    }
  </div>
  <pb-answer-bar
    answer
    group="read"
    [kind]="bar().kind"
    [message]="bar().message"
    [ready]="bar().ready"
    (action)="action()"
  />
</pb-round-shell>
