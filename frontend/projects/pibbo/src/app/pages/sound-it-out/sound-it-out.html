<pb-round-shell
  title="Sound it out"
  group="read"
  [instruction]="instruction()"
  [mood]="mood()"
  [done]="done()"
  [rounds]="content.roundsPerPlay"
  (replay)="replay()"
  (leave)="leave()"
>
  <div class="stage">
    <pb-word-tiles
      [sounds]="round().word.sounds"
      [heard]="round().heard"
      [next]="nextToTouch()"
      [sounding]="sounding()"
      [showBlend]="!picking() && !choices()"
      [canBlend]="round().phase === 'ready'"
      [choices]="choices()"
      (touched)="touchLetter($event)"
      (blend)="blend()"
      (chose)="chooseFirstTwo($event)"
    />
    @if (picking()) {
      <pb-picture-pick
        [pictures]="round().pictures"
        [chosen]="round().chosen"
        [right]="right()"
        [locked]="round().phase !== 'picking'"
        (chose)="choosePicture($event)"
      />
    }
  </div>
  <pb-answer-bar
    answer
    group="read"
    [kind]="bar().kind"
    [message]="bar().message"
    [ready]="bar().ready"
    (action)="action()"
  />
</pb-round-shell>
