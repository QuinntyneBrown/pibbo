<pb-round-shell
  title="Rocket countdown"
  [instruction]="instruction()"
  [mood]="mood()"
  [done]="done()"
  [rounds]="content.roundsPerPlay"
  (replay)="replay()"
  (leave)="leave()"
>
  <pb-countdown
    [start]="round().start"
    [current]="round().current"
    [choices]="round().choices"
    [done]="round().phase === 'done'"
    [notch]="notch()"
    [locked]="round().phase !== 'counting'"
    (chose)="choose($event)"
  />
  <pb-answer-bar answer [kind]="bar().kind" [message]="bar().message" (action)="action()" />
</pb-round-shell>
