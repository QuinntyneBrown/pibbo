<div class="placeholder">
  <main class="placeholder__main" id="main">
    @if (activity(); as activity) {
      <span class="placeholder__glyph" aria-hidden="true">{{ activity.glyph }}</span>
      <h1 class="placeholder__title">{{ activity.name }}</h1>
    }
    <button type="button" class="chunky chunky--ink press placeholder__home" (pbTap)="goHome()">
      Home
    </button>
  </main>
</div>
