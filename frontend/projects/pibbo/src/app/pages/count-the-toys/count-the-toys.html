<pb-round-shell
  title="Count the toys"
  [instruction]="instruction()"
  (replay)="replay()"
  (leave)="leave()"
>
  <div class="stage">
    <pb-count-set
      [things]="round().things"
      [countedAs]="round().countedAs"
      (touched)="touchThing($event)"
    />
    <pb-tally
      [counted]="counted()"
      [choices]="round().choices"
      [chosen]="round().chosen"
      (chose)="chooseNumeral($event)"
    />
  </div>
  <pb-answer-bar answer [ready]="round().chosen !== null" (action)="check()" />
</pb-round-shell>
