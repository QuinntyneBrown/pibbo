<pb-round-shell
  title="Count the toys"
  [instruction]="instruction()"
  (replay)="replay()"
  (leave)="leave()"
>
  <div class="stage">
    <pb-count-set
      [things]="round().things"
      [countedAs]="round().countedAs"
      (touched)="touchThing($event)"
    />
    <pb-tally [counted]="counted()" />
  </div>
</pb-round-shell>
