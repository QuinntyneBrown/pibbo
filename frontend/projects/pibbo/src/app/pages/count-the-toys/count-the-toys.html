<pb-round-shell
  title="Count the toys"
  [instruction]="instruction()"
  [mood]="mood()"
  [done]="done()"
  [rounds]="content.roundsPerPlay"
  (replay)="replay()"
  (leave)="leave()"
>
  <div class="stage">
    <pb-count-set
      [things]="round().things"
      [countedAs]="round().countedAs"
      [lit]="lit()"
      (touched)="touchThing($event)"
    />
    <pb-tally
      [counted]="counted()"
      [choices]="round().choices"
      [chosen]="round().chosen"
      [modelled]="round().phase === 'modelled' ? round().answer : null"
      [locked]="round().phase !== 'choosing'"
      (chose)="chooseNumeral($event)"
    />
  </div>
  <pb-answer-bar
    answer
    [kind]="bar().kind"
    [message]="bar().message"
    [ready]="bar().ready"
    (action)="action()"
  />
</pb-round-shell>
