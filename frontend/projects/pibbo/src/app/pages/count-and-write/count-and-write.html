<pb-round-shell
  title="Count and write"
  [instruction]="instruction()"
  [mood]="mood()"
  [done]="done()"
  [rounds]="content.roundsPerPlay"
  (replay)="replay()"
  (leave)="leave()"
>
  <div class="stage">
    <pb-tenframes
      [things]="round().things"
      [frames]="frames()"
      [countedAs]="round().countedAs"
      [small]="round().phase !== 'counting'"
      (touched)="countThing($event)"
    />
    @if (round().phase !== 'counting') {
      <pb-digit-pad
        [written]="round().written"
        [answer]="round().phase === 'modelled'"
        [lit]="lit()"
        [locked]="round().phase !== 'writing'"
        (wrote)="writeDigit($event)"
        (cleared)="clearDigits()"
      />
    }
  </div>
  <pb-answer-bar
    answer
    [kind]="bar().kind"
    [message]="bar().message"
    [ready]="bar().ready"
    (action)="action()"
  />
</pb-round-shell>
