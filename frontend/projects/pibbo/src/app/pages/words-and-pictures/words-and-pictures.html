<pb-round-shell
  title="Words and pictures"
  group="read"
  [fit]="true"
  [instruction]="instruction()"
  mood="rest"
  [done]="done()"
  [rounds]="content.roundsPerPlay"
  (replay)="replay()"
  (leave)="leave()"
>
  <pb-word-pictures
    [words]="round().words"
    [pictures]="round().pictures"
    [wordColours]="wordColours()"
    [pictureColours]="pictureColours()"
    [held]="round().held"
  />
  <pb-answer-bar answer group="read" kind="none" message="" />
</pb-round-shell>
