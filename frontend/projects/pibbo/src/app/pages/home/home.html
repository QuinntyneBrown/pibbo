<div class="home">
  <header class="home__top">
    <pb-wordmark size="md" />
    <div class="home__me">
      <pb-child-badge [name]="child.name" [stars]="totalStars" />
      <pb-grown-up-entry (touched)="openGate()" />
    </div>
  </header>
  <main class="home__main" id="main">
    <h1 class="visually-hidden">Choose an activity</h1>
    <section class="home__hero" aria-label="Today">
      @if (lesson(); as today) {
        <pb-lesson-card
          [subject]="chosen().id"
          [hello]="hello"
          [title]="today.lesson.title"
          [games]="today.games"
          [done]="today.done"
          [action]="today.line.text"
          (touched)="openLesson(today.lesson, today.line.recording)"
        />
      }
      <pb-check-card [name]="checkGame.name" [text]="checkGame.text" (touched)="openCheckGame()" />
    </section>
    <nav class="home__subjects" aria-label="Subjects">
      <pb-group-switch
        [groups]="catalogue.groups"
        [chosen]="chosen().id"
        (touched)="chooseGroup($event)"
      />
    </nav>
    <div class="home__games">
      @for (section of sections(); track section.name) {
        <pb-activity-grid
          [title]="section.name"
          [activities]="section.activities"
          [stars]="stars"
          [offline]="unavailable()"
          (touched)="openActivity($event)"
        />
      }
    </div>
  </main>
</div>
