<div class="home">
  <header class="home__top">
    <pb-wordmark size="md" />
  </header>
  <main class="home__main" id="main">
    <h1 class="visually-hidden">Choose an activity</h1>
    <nav class="home__subjects" aria-label="Groups">
      <pb-group-switch
        [groups]="catalogue.groups"
        [chosen]="chosen()?.id ?? null"
        (touched)="chooseGroup($event)"
      />
    </nav>
    <div class="home__games">
      @if (chosen(); as group) {
        <pb-activity-grid
          [title]="group.name"
          [activities]="screen().activities"
          [more]="more()"
          (touched)="openActivity($event)"
          (next)="showMore()"
        />
      }
    </div>
  </main>
</div>
