<pb-round-shell
  title="Skip-count"
  [instruction]="instruction()"
  [mood]="mood()"
  [done]="done()"
  [rounds]="content.roundsPerPlay"
  (replay)="replay()"
  (leave)="leave()"
>
  <pb-number-line
    [steps]="content.steps"
    [step]="round().step"
    [said]="said()"
    [hops]="content.hops"
    [choices]="round().choices"
    [locked]="round().phase !== 'counting'"
    (chose)="choose($event)"
    (stepped)="stepBy($event)"
  />
  <pb-answer-bar answer [kind]="bar().kind" [message]="bar().message" (action)="action()" />
</pb-round-shell>
