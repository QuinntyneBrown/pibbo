<pb-round-shell
  title="Letter sounds"
  group="read"
  [instruction]="content.instruction"
  [mood]="mood()"
  [done]="done()"
  [rounds]="content.roundsPerPlay"
  (replay)="replay()"
  (leave)="leave()"
>
  <pb-pairs
    [letters]="round().letters"
    [sounds]="round().sounds"
    [letterColours]="letterColours()"
    [soundColours]="soundColours()"
    [held]="round().held"
    [missed]="missed()"
    (letter)="touchLetter($event)"
    (sound)="touchSound($event)"
  />
  <pb-answer-bar
    answer
    group="read"
    [kind]="right() ? 'right' : 'none'"
    [message]="right() ? content.praise.text : ''"
    (action)="next()"
  />
</pb-round-shell>
