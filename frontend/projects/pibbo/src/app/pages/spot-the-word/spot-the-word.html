<pb-round-shell
  title="Spot the word"
  layout="story"
  group="read"
  [instruction]="instruction()"
  [mood]="mood()"
  [done]="done()"
  [rounds]="content.roundsPerPlay"
  (replay)="replay()"
  (leave)="leave()"
>
  <pb-spot
    [word]="round().word.word"
    [story]="round().story"
    [found]="round().found"
    [total]="total()"
    [miss]="round().miss"
    [done]="round().phase === 'right'"
    [status]="status()"
    (touched)="touchWord($event)"
  />
  <pb-answer-bar
    answer
    group="read"
    [kind]="bar().kind"
    [message]="bar().message"
    (action)="action()"
  />
</pb-round-shell>
