# The content service as a Docker Swarm stack. Deploy with deploy.sh, never by hand.
#
# A new release starts beside the running one. Swarm sends it traffic only once its health
# check (the readiness probe) passes; if it never does, the update rolls back to the release
# that was running, which kept serving all along.
services:
  api:
    # The image is promoted unchanged between environments: always deploy it by digest.
    image: ${PIBBO_API_IMAGE:?set PIBBO_API_IMAGE to the image to deploy, by digest}
    environment:
      # TLS ends at the proxy in front, which redirects HTTP and passes X-Forwarded-*.
      Transport__RequireHttps: "false"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Cors__FrontendOrigin: ${PIBBO_FRONTEND_ORIGIN:-}
    ports:
      - target: 8080
        published: ${PIBBO_PORT:-8080}
    volumes:
      # content.json and assets/. Writable, so editors can upload; read_only: true if they never do.
      - type: bind
        source: ${PIBBO_CONTENT_DIR:?set PIBBO_CONTENT_DIR to the folder holding content.json and assets/}
        target: /app/content
      - data:/data
    healthcheck:
      test: ["CMD", "dotnet", "Pibbo.Api.dll", "probe"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      replicas: ${PIBBO_REPLICAS:-1}
      update_config:
        order: start-first
        parallelism: 1
        delay: 5s
        monitor: 30s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
        delay: 5s

networks:
  default:
    # So a proxy (or a check) can join it and reach the service by name.
    attachable: true

volumes:
  data:
